<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>우주 탐사 퀴즈 · COSMIC QUEST</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f1f3fc;
      --card: #ffffff;
      --text: #17203c;
      --muted: #53617c;
      --border: #d5dced;
      --accent: #5841c6;
      --accent-soft: #eeeaff;
      --correct: #14643b;
      --correct-bg: #e4f6eb;
      --wrong: #ab233b;
      --wrong-bg: #ffebef;
      --shadow: 0 24px 80px #28386414;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1022;
        --card: #151d35;
        --text: #edf0ff;
        --muted: #b2bdd8;
        --border: #384560;
        --accent: #c2b0ff;
        --accent-soft: #2b2549;
        --correct: #8de2af;
        --correct-bg: #133c2b;
        --wrong: #ffabb9;
        --wrong-bg: #492130;
        --shadow: 0 24px 80px #00000035;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 40px 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 10% 0%, #8871ed20, transparent 55%),
        radial-gradient(ellipse at 95% 95%, #3eaebc18, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    button { font: inherit; }
    button:not([aria-disabled="true"]) { cursor: pointer; }
    button, a { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    h2:focus, #feedback:focus { outline: none; }
    .shell { width: min(100%, 720px); }
    .brand { margin: 0 0 22px; color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .2em; }
    .brand span { margin-right: 8px; font-size: 1.2rem; }
    .card { padding: clamp(24px, 5vw, 44px); border: 1px solid var(--border); border-radius: 28px; background: var(--card); box-shadow: var(--shadow); }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.5rem); letter-spacing: -.05em; line-height: 1.3; }
    .intro { margin: 12px 0 26px; color: var(--muted); }
    .dashboard { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; font-size: .9rem; }
    .score { padding: 5px 13px; border-radius: 999px; color: var(--accent); background: var(--accent-soft); font-weight: 700; }
    progress { display: block; width: 100%; height: 8px; border: 0; border-radius: 99px; overflow: hidden; background: var(--border); accent-color: var(--accent); }
    progress::-webkit-progress-bar { background: var(--border); border-radius: 99px; }
    progress::-webkit-progress-value { background: var(--accent); border-radius: 99px; transition: width .3s ease; }
    progress::-moz-progress-bar { background: var(--accent); border-radius: 99px; }
    .question-block { margin-top: 30px; }
    .question-number { color: var(--muted); font-size: .8rem; font-weight: 700; letter-spacing: .08em; }
    h2 { margin: 8px 0 22px; font-size: clamp(1.25rem, 3.5vw, 1.55rem); line-height: 1.55; letter-spacing: -.03em; overflow-wrap: anywhere; }
    .answers { display: grid; gap: 11px; }
    .answer {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 64px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      text-align: left;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .answer:not([aria-disabled="true"]):hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-2px); }
    .letter { flex: 0 0 30px; display: grid; place-items: center; height: 30px; border-radius: 9px; background: var(--bg); color: var(--muted); font-size: .8rem; font-weight: 800; }
    .answer-label { flex: 1; }
    .answer-mark { font-size: .8rem; font-weight: 800; }
    .answer.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); animation: celebrate .5s ease; }
    .answer.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); animation: shake .45s ease; }
    .feedback { margin-top: 20px; padding: 18px 20px; border-radius: 14px; border: 1px solid; }
    .feedback.correct { color: var(--correct); background: var(--correct-bg); }
    .feedback.wrong { color: var(--wrong); background: var(--wrong-bg); }
    .feedback strong { display: block; margin-bottom: 5px; }
    .feedback p { margin: 0; font-size: .92rem; }
    .actions { margin-top: 24px; display: flex; justify-content: flex-end; }
    .primary { min-height: 48px; padding: 12px 23px; border: 2px solid transparent; border-radius: 12px; background: var(--accent); color: var(--card); font-weight: 800; }
    .primary:hover { filter: brightness(.92); }
    .hint { margin: 22px 0 0; color: var(--muted); font-size: .8rem; text-align: center; }
    kbd { font-family: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
    .result { padding-top: 30px; text-align: center; }
    .result-emoji { margin: 0; font-size: clamp(5rem, 16vw, 6.5rem); line-height: 1.3; animation: arrive .6s ease both; }
    .result h2 { margin-bottom: 10px; }
    .result-score { margin: 12px 0; color: var(--accent); font-size: 3rem; font-weight: 850; letter-spacing: -.06em; }
    .result-score span { font-size: 1.2rem; color: var(--muted); letter-spacing: 0; }
    .result-copy { margin: 0 auto 26px; max-width: 32em; color: var(--muted); }
    footer { margin-top: 20px; color: var(--muted); text-align: center; font-size: .75rem; letter-spacing: .04em; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }
    @keyframes celebrate {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); box-shadow: 0 0 0 5px var(--correct-bg); }
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px) scale(.85); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (max-width: 420px) {
      body { padding: 20px 12px; }
      .card { padding: 24px 18px; border-radius: 20px; }
      .answer { padding: 12px; gap: 10px; }
      .answer-mark { max-width: 3em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    @media (forced-colors: active) {
      .answer.correct, .answer.wrong, .feedback { border-width: 3px; }
      .primary { border-color: ButtonText; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="brand"><span aria-hidden="true">✦</span>COSMIC QUEST</p>
    <div class="card">
      <header>
        <p class="eyebrow">MISSION · 우주 탐사</p>
        <h1>당신의 우주 지식은<br>어디까지 닿아 있나요?</h1>
        <p class="intro">10개의 질문을 따라, 지구 너머로 떠나는 작은 탐험.</p>
      </header>

      <div class="dashboard">
        <span id="progress-text">탐사 진행 · 0 / 10</span>
        <span class="score">✧ 점수 <span id="score">0</span> / 100</span>
      </div>
      <label for="progress" class="sr-only">답변을 완료한 문항 수</label>
      <progress id="progress" value="0" max="10">0 / 10</progress>
      <p id="announcer" class="sr-only" role="status" aria-atomic="true"></p>

      <section id="quiz" class="question-block" aria-labelledby="question">
        <div id="question-number" class="question-number"></div>
        <h2 id="question" tabindex="-1"></h2>
        <div id="answers" class="answers" role="group" aria-labelledby="question"></div>
        <div id="feedback" class="feedback" tabindex="-1" role="region" aria-labelledby="feedback-title" aria-describedby="explanation" hidden>
          <strong id="feedback-title"></strong>
          <p id="explanation"></p>
        </div>
        <div class="actions">
          <button id="next" class="primary" type="button" hidden>다음 탐사 →</button>
        </div>
        <p class="hint"><kbd>Tab</kbd>으로 이동 · <kbd>Enter</kbd> 또는 <kbd>Space</kbd>로 선택</p>
      </section>

      <section id="result" class="result" aria-labelledby="result-title" hidden>
        <p id="result-emoji" class="result-emoji" aria-hidden="true"></p>
        <p class="eyebrow">MISSION COMPLETE</p>
        <h2 id="result-title" tabindex="-1"></h2>
        <p class="result-score" id="result-score"></p>
        <p class="result-copy" id="result-copy"></p>
        <button id="restart" class="primary" type="button">다시 탐사하기 ↗</button>
      </section>
      <noscript><p>퀴즈를 진행하려면 브라우저의 JavaScript를 켜 주세요. 인터넷 연결은 필요하지 않습니다.</p></noscript>
    </div>
    <footer>지구에서 시작하는, 무한한 호기심의 여정 <span aria-hidden="true">🪐</span></footer>
  </main>

  <script>
    "use strict";

    const questions = [
      {
        question: "인류 최초로 달 표면에 발을 디딘 우주비행사는 누구일까요?",
        answers: ["유리 가가린", "닐 암스트롱", "버즈 올드린", "마이클 콜린스"],
        correct: 1,
        explanation: "닐 암스트롱은 1969년 아폴로 11호 임무에서 인류 최초로 달에 발을 디뎠어요."
      },
      {
        question: "태양계에서 가장 큰 행성은 무엇일까요?",
        answers: ["지구", "해왕성", "토성", "목성"],
        correct: 3,
        explanation: "목성은 태양계에서 가장 큰 행성이에요. 지름이 지구의 약 11배나 된답니다."
      },
      {
        question: "‘붉은 행성’이라는 별명을 가진 행성은 무엇일까요?",
        answers: ["화성", "금성", "수성", "천왕성"],
        correct: 0,
        explanation: "화성 표면의 산화 철, 즉 녹 성분이 붉은빛을 띠게 해요."
      },
      {
        question: "인류 최초의 인공위성 이름은 무엇일까요?",
        answers: ["보이저 1호", "허블", "스푸트니크 1호", "아폴로 1호"],
        correct: 2,
        explanation: "1957년 발사된 스푸트니크 1호는 지구 궤도를 도는 최초의 인공위성이었어요."
      },
      {
        question: "우주 공간에서 우주복 없이 서로의 목소리를 직접 들을 수 없는 이유는?",
        answers: ["햇빛이 너무 강해서", "소리를 전달할 공기가 거의 없어서", "중력이 너무 강해서", "소리가 빛보다 빨라서"],
        correct: 1,
        explanation: "소리는 공기 같은 매질을 통해 전달돼요. 진공에 가까운 우주에서는 무전기로 대화해야 해요."
      },
      {
        question: "국제우주정거장(ISS)은 주로 어디를 돌고 있을까요?",
        answers: ["달 주변", "화성과 목성 사이", "태양 표면 근처", "지구의 낮은 궤도"],
        correct: 3,
        explanation: "ISS는 지상 약 400km의 지구 저궤도를 돌며, 약 90분마다 지구를 한 바퀴 돌아요."
      },
      {
        question: "태양에서 나온 빛이 지구에 도착하기까지 걸리는 시간은 대략 얼마일까요?",
        answers: ["약 1초", "약 1시간", "약 8분 20초", "약 하루"],
        correct: 2,
        explanation: "빛은 초속 약 30만 km로 이동해요. 태양과 지구 사이 약 1억 5천만 km를 오는 데 약 8분 20초가 걸려요."
      },
      {
        question: "태양계에서 가장 뚜렷하고 거대한 고리로 유명한 행성은?",
        answers: ["토성", "화성", "금성", "수성"],
        correct: 0,
        explanation: "토성의 고리는 주로 수많은 얼음 조각과 암석으로 이루어져 있어요. 다른 거대 행성에도 고리가 있답니다."
      },
      {
        question: "제임스 웹 우주망원경이 주로 관측하는 빛의 종류는 무엇일까요?",
        answers: ["감마선", "적외선", "전파", "엑스선"],
        correct: 1,
        explanation: "제임스 웹 우주망원경은 주로 적외선을 관측해 아주 먼 은하와 별이 태어나는 영역을 연구해요."
      },
      {
        question: "태양계를 넘어 성간 공간에 처음 진입한 인공 탐사선은?",
        answers: ["뉴 허라이즌스", "큐리오시티", "카시니", "보이저 1호"],
        correct: 3,
        explanation: "보이저 1호는 2012년 태양권계면을 넘어 성간 공간에 진입했어요. 태양의 영향권 경계 너머로 여행을 이어가고 있답니다."
      }
    ];

    const ui = {
      quiz: document.getElementById("quiz"),
      question: document.getElementById("question"),
      number: document.getElementById("question-number"),
      answers: document.getElementById("answers"),
      feedback: document.getElementById("feedback"),
      feedbackTitle: document.getElementById("feedback-title"),
      explanation: document.getElementById("explanation"),
      next: document.getElementById("next"),
      progress: document.getElementById("progress"),
      progressText: document.getElementById("progress-text"),
      score: document.getElementById("score"),
      announcer: document.getElementById("announcer"),
      result: document.getElementById("result"),
      resultTitle: document.getElementById("result-title"),
      resultEmoji: document.getElementById("result-emoji"),
      resultScore: document.getElementById("result-score"),
      resultCopy: document.getElementById("result-copy"),
      restart: document.getElementById("restart")
    };

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    let order = shuffle(questions);
    let current = 0;
    let score = 0;
    let answered = false;
    let scoreAnimation = null;

    function updateProgress(completed) {
      ui.progress.value = completed;
      ui.progress.textContent = `${completed} / ${questions.length}`;
      ui.progressText.textContent = `탐사 진행 · ${completed} / ${questions.length}`;
      ui.score.textContent = score;
    }

    function renderQuestion(moveFocus = true) {
      answered = false;
      const item = order[current];
      ui.number.textContent = `QUESTION ${String(current + 1).padStart(2, "0")} / ${questions.length}`;
      ui.question.textContent = item.question;
      ui.question.setAttribute("aria-label", `${current + 1}번 문제. ${item.question}`);
      ui.answers.replaceChildren();
      ui.feedback.hidden = true;
      ui.next.hidden = true;

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";

        const letter = document.createElement("span");
        letter.className = "letter";
        letter.setAttribute("aria-hidden", "true");
        letter.textContent = String.fromCharCode(65 + index);

        const label = document.createElement("span");
        label.className = "answer-label";
        label.textContent = answer;

        const mark = document.createElement("span");
        mark.className = "answer-mark";
        button.append(letter, label, mark);
        button.addEventListener("click", () => selectAnswer(index));
        ui.answers.append(button);
      });

      if (moveFocus) ui.question.focus();
    }

    function selectAnswer(selected) {
      if (answered) return;
      answered = true;
      const item = order[current];
      const correct = selected === item.correct;
      if (correct) score += 10;

      Array.from(ui.answers.children).forEach((button, index) => {
        button.setAttribute("aria-disabled", "true");
        const mark = button.querySelector(".answer-mark");
        if (index === item.correct) {
          button.classList.add("correct");
          mark.textContent = "✓ 정답";
        } else if (index === selected) {
          button.classList.add("wrong");
          mark.textContent = "✕ 오답";
        }
      });

      ui.feedback.className = `feedback ${correct ? "correct" : "wrong"}`;
      ui.feedbackTitle.textContent = correct ? "🎉 정답이에요! 멋진 탐사예요." : "🌠 아쉬워요! 새로운 사실을 발견했네요.";
      ui.explanation.textContent = correct
        ? item.explanation
        : `정답: ${item.answers[item.correct]}. ${item.explanation}`;
      ui.feedback.hidden = false;
      ui.next.textContent = current === questions.length - 1 ? "탐사 결과 보기 →" : "다음 탐사 →";
      ui.next.hidden = false;
      updateProgress(current + 1);
      ui.announcer.textContent = `현재 점수 ${score}점. ${current + 1}개 문항 완료.`;
      ui.feedback.focus();
    }

    function showResult() {
      ui.quiz.hidden = true;
      ui.result.hidden = false;
      const reaction = score === 100
        ? { emoji: "🏆🚀", title: "완벽한 우주 탐사 대장!", copy: "모든 미션을 성공했어요. 당신의 호기심은 은하 너머까지 닿아 있네요!" }
        : score >= 70
          ? { emoji: "🧑‍🚀✨", title: "멋진 우주 탐험가!", copy: "든든한 우주 지식을 갖추었어요. 오늘 발견한 사실들과 함께 더 멀리 떠나 보세요." }
          : score >= 40
            ? { emoji: "🪐🔭", title: "성장하는 별빛 탐험가!", copy: "새로운 우주 지식이 차곡차곡 쌓이고 있어요. 호기심이 있다면 다음 탐사도 즐거울 거예요." }
            : { emoji: "🌱🚀", title: "첫 탐사를 마친 당신에게 박수!", copy: "모든 우주비행사도 첫걸음부터 시작했어요. 오늘 배운 사실을 안고 다시 도전해 보세요!" };
      ui.resultEmoji.textContent = reaction.emoji;
      ui.resultTitle.textContent = reaction.title;
      cancelAnimationFrame(scoreAnimation);
      const finalScore = score;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const scoreText = document.createTextNode(`${reduceMotion ? finalScore : 0} `);
      ui.resultScore.replaceChildren(scoreText);
      const total = document.createElement("span");
      total.textContent = "/ 100점";
      ui.resultScore.append(total);
      if (!reduceMotion && finalScore > 0) {
        let start;
        function animateScore(timestamp) {
          if (start === undefined) start = timestamp;
          const progress = Math.min((timestamp - start) / 1200, 1);
          scoreText.textContent = `${Math.round(finalScore * (1 - (1 - progress) ** 3))} `;
          scoreAnimation = progress < 1 ? requestAnimationFrame(animateScore) : null;
        }
        scoreAnimation = requestAnimationFrame(animateScore);
      }
      ui.resultCopy.textContent = `10문항 중 ${score / 10}문항 정답. ${reaction.copy}`;
      ui.resultTitle.focus();
    }

    ui.next.addEventListener("click", () => {
      if (!answered) return;
      if (current === questions.length - 1) {
        showResult();
      } else {
        current += 1;
        renderQuestion();
      }
    });

    ui.restart.addEventListener("click", () => {
      cancelAnimationFrame(scoreAnimation);
      scoreAnimation = null;
      current = 0;
      score = 0;
      answered = false;
      order = shuffle(questions);
      ui.result.hidden = true;
      ui.quiz.hidden = false;
      ui.announcer.textContent = "새 탐사를 시작합니다. 점수 0점.";
      updateProgress(0);
      renderQuestion();
    });

    updateProgress(0);
    renderQuestion(false);
  </script>
</body>
</html>
